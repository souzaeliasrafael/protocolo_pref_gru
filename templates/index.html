<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="primeira">
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <header>
        
    </header>
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card p-4 shadow-sm" style="max-width: 500px; width: 100%;">
                <img class="logo" src="Logo-gru.jpeg" alt="Logo da Prefeitura de GUARULHOS">
                <h1 class="text-center mb-4" style="font-weight: bold; font-size: 20px;">SISTEMA DE PROTOCOLO</h1>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label" style="font-weight: bold; font-size: 20px;">Usuário</label>
                        <input type="text" class="form-control" id="username" placeholder="Digite seu Usuário" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label" style="font-weight: bold; font-size: 20px;">Senha</label>
                        <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <div class="mt-3 text-center">
                    <small><a href="#">Esqueceu sua senha?</a></small><br>
                </div>
            </div>
        </div>

    <script>
        // Adiciona o evento de submissão ao formulário
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário

            // Credenciais do primeiro login
            const validUsername = "23201642";
            const validPassword = "PIUNIVESP";

            // Obtém os valores inseridos pelo usuário
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Valida as credenciais
            if (username === validUsername && password === validPassword) {
                // Redireciona para a Tela 1.html
                window.location.href = "Tela 1.html";
            } else {
                // Exibe uma mensagem de erro
                alert("Usuário ou senha inválidos. Tente novamente.");
            }
        });
    </script>
</body>
</html>
